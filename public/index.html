<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container text-center mt-5">
    <div class="card mx-auto" style="max-width: 400px;">
      <img src="https://via.placeholder.com/150" class="card-img-top rounded-circle mt-3 mx-auto" style="width: 150px;" alt="Profile">
      <div class="card-body">
        <h2 id="name">Anton Krupchuk</h2>
        <p id="bio">Student | Computer Engineering</p>
        <p id="contact">Email: anton.krupchuk.ki.2021@lpnu.ua</p>
        <p id="phone">Phone: +1234567890</p>
        <div class="social-links">
          <a href="#" id="linkedin">LinkedIn</a> | <a href="#" id="twitter">Twitter</a>
        </div>
        <a href="/login" class="btn btn-primary mt-3">Login</a>
        <a href="/register" class="btn btn-secondary mt-3">Register</a>
      </div>
    </div>
  </div>
</body>
</html>
