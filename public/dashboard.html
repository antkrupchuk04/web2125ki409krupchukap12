<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container mt-5">
    <h2>Edit Business Card</h2>
    <form id="cardForm">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="mb-3">
        <label for="bio" class="form-label">Bio</label>
        <input type="text" class="form-control" id="bio" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input type="tel" class="form-control" id="phone" required>
      </div>
      <div class="mb-3">
        <label for="linkedin" class="form-label">LinkedIn URL</label>
        <input type="url" class="form-control" id="linkedin">
      </div>
      <div class="mb-3">
        <label for="twitter" class="form-label">Twitter URL</label>
        <input type="url" class="form-control" id="twitter">
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
    <a href="/auth/logout" class="btn btn-danger mt-3">Logout</a>
    <a href="/" class="btn btn-link mt-3">Back to Home</a>
  </div>
  <script src="/js/dashboard.js"></script>
</body>
</html>
